.review-title{margin-bottom:12px}.review-intro{color:var(--muted);font-size:17px;margin:4px 0 17px}.review-sheet{padding:clamp(10px,2.5vw,22px);margin-bottom:14px}.review-table{width:100%;border-collapse:collapse;table-layout:fixed}.review-table caption{text-align:left;padding:0 0 10px;color:var(--ink);font-size:21px;font-weight:850}.review-table col:first-child{width:18%}.review-table th,.review-table td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:10px 8px;overflow-wrap:anywhere}.review-table thead{background:var(--soft);color:var(--accent)}.review-table tbody th{font-size:clamp(15px,2vw,20px)}.review-table tbody td{font-size:clamp(17px,2.15vw,24px);line-height:1.6}.review-table tr:last-child>*{border-bottom:0}.review-table .review-route{padding:10px 8px 13px}.review-route .writing-route{margin-top:4px}.review-status{margin:0;color:var(--muted)}@media(max-width:520px){.hunt-head,.hunt-footer{gap:6px;padding:11px 12px}.hunt-head h1{font-size:26px}.review-table col:first-child{width:23%}.review-table th,.review-table td{padding-inline:5px}}
.review-steps{list-style:none;display:grid;gap:6px;padding:0;margin:0}.review-step{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:baseline;gap:4px 12px;padding:7px 9px;border-inline-start:3px solid var(--review-line);border-radius:8px;background:var(--review-fill);color:#183239}.review-step:nth-child(1){--review-fill:#deefdf;--review-line:#4a8762}.review-step:nth-child(2){--review-fill:#faebbe;--review-line:#997721}.review-step:nth-child(3){--review-fill:#f3dbe4;--review-line:#a35976}.review-step-label{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:850;white-space:nowrap}.review-step-label b{display:inline-grid;place-items:center;min-width:1.7em;min-height:1.7em;border-radius:50%;background:#ffffffa3;font-variant-numeric:tabular-nums}.review-step-text{min-width:0}@media(max-width:580px){.review-step{grid-template-columns:1fr;gap:3px;padding:5px 8px}.review-step-label{font-size:14px}}

}
function openTeacher() {
  teacher.innerHTML = `${modalHead('teacher','👩‍🏫 教師控制台')}<div class="drawer-content"><p class="note">免密碼示範工具：可直接進入指定畫面，不影響學生已完成的進度。</p>${stages.map((stage,index)=>`<section class="drawer-row tone-${index}"><h3>${stage.order} · ${stage.name}</h3><div class="flex flex-wrap gap-2">${[['station','情境思考站'],['hunt','魔法相機尋影'],['game','答題畫面'],['pause','面向老師'],['summary','拖拉小總結']].map(([screen,label])=>`<button class="button ghost" data-action="jump" data-stage="${index}" data-view="${screen}">${label}</button>`).join('')}</div></section>`).join('')}</div>`;
  teacher.showModal();
}
function jump(stage,screen) {
  teacher.close();
  demoBackup ||= {view,currentRun};
  currentRun = makeRun(stage);
  go(screen);
}
function exitDemo() {
  if (!demoBackup) return;
  const previous = demoBackup;
  demoBackup = null;
  currentRun = previous.currentRun;
  go(previous.view);
}
for (const dialog of [atlas,teacher]) {
  dialog.addEventListener('click',event=>{
    if (event.target !== dialog) return;
    const {left,right,top,bottom} = dialog.getBoundingClientRect();
    if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) dialog.close();
  });
}
document.addEventListener('click',event=>{
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const {action,stage,index,view:screen,word,slot} = button.dataset;
  if ((action === 'word' || action === 'slot') && event.detail > 0 && performance.now() < clickSuppressedUntil) return;
  switch (action) {
    case 'home': if (demoBackup) exitDemo(); else go('home'); break;
    case 'difficulty':
      player.difficulty = button.dataset.mode;
      renderHome();
      app.querySelector('[data-action="difficulty"][aria-pressed="true"]').focus({preventScroll:true});
      break;
    case 'start': start(Number(stage)); break;
    case 'begin': go('hunt'); break;
    case 'capture': captureAnimal(Number(index)); break;
    case 'hunt-finish': if (view === 'hunt' && currentRun.roundIndex === currentRun.rounds.length) go('pause'); break;
    case 'reveal': reveal(Number(index)); break;
    case 'answer': answer(Number(index),button); break;
    case 'next': advance(); break;
    case 'confirm-teacher': go('summary'); break;
    case 'word': {
      const {summary} = currentRun;
      const selected = summary.bank[Number(word)];
      summary.selected = summary.selected === selected ? null : selected;
      summary.status = summary.selected ? `已選「${selected}」。點一下你想填的空格。` : '已取消選取。';
      updateSummary(`[data-word="${word}"]`);
      break;
    }
    case 'slot': setSlot(Number(slot),currentRun.summary.selected); break;
    case 'check-summary': checkSummary(); break;
    case 'finish-summary':
      if (!currentRun.summary.passed) break;
      if (currentRun.stage === 1) go('review');
      else if (demoBackup) exitDemo();
      else if (currentRun.stage === 2) go('certificate');
      else if (currentRun.replay) go('home');
      else start(currentRun.stage+1);
      break;
    case 'finish-review': finishReview(); break;
    case 'certificate': if (player.finished === 2) go('certificate'); break;
    case 'copy': copyNotes(); break;
    case 'atlas': openAtlas(); break;
    case 'teacher': openTeacher(); break;
    case 'close-dialog': button.closest('dialog').close(); break;
    case 'filter': filterAtlas(Number(stage)); break;
    case 'jump': jump(Number(stage),screen); break;
    case 'exit-demo': exitDemo(); break;
  }
});
render();
</script>
